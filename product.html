<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прямий диван "Nordic" — MebliHome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container header__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="#">Про нас</a>
        <a href="#">Контакти</a>
      </nav>
      <div class="header__cart">
        <a href="cart.html" class="cart-btn">Кошик (<span>0</span>)</a>
      </div>
    </div>
  </header>

  <!-- Хлібні крихти -->
  <div class="container page-header">
    <ul class="breadcrumbs">
      <li><a href="index.html">Головна</a></li>
      <li><a href="catalog.html">Дивани</a></li>
      <li><span>Прямий диван "Nordic"</span></li>
    </ul>
  </div>

  <!-- Товар -->
  <main class="container product-detail">
    <div class="product-detail__grid">
      
      <!-- Галерея фото -->
      <div class="product-gallery">
        <div class="product-gallery__main" style="background-image: url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80');"></div>
        <div class="product-gallery__thumbs">
          <div class="thumb active" style="background-image: url('https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=200&q=80');"></div>
          <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=200&q=80');"></div>
        </div>
      </div>

      <!-- Інформація -->
      <div class="product-info">
        <span class="category-tag">Артикул: NB-10492</span>
        <h1 class="product-title">Прямий диван "Nordic"</h1>
        
        <div class="product-status">
          <span class="status status--in-stock">● В наявності</span>
          <span class="rating">★ 4.9 (24 відгуки)</span>
        </div>

        <div class="product-price-box">
          <span class="price-current">18 500 грн</span>
        </div>

        <!-- Варіанти -->
        <div class="product-options">
          <div class="option-group">
            <label>Колір обивки:</label>
            <div class="color-picker">
              <button class="color-btn active" style="background-color: #2c3e50;" title="Темно-синій"></button>
              <button class="color-btn" style="background-color: #7f8c8d;" title="Сірий"></button>
              <button class="color-btn" style="background-color: #556b2f;" title="Оливковий"></button>
            </div>
          </div>

          <div class="option-group">
            <label for="size-select">Розмір спального місця:</label>
            <select id="size-select" class="option-select">
              <option value="140x200">140 × 200 см</option>
              <option value="160x200" selected>160 × 200 см</option>
              <option value="180x200">180 × 200 см</option>
            </select>
          </div>
        </div>

        <!-- Кількість і кнопка -->
        <div class="product-actions">
          <div class="quantity-counter">
            <button type="button" class="qty-btn">-</button>
            <input type="number" value="1" min="1" max="99">
            <button type="button" class="qty-btn">+</button>
          </div>
          <button class="btn btn--lg">Додати в кошик</button>
        </div>
      </div>
    </div>
  </main>
<div class="color-picker">
  <button class="color-btn active" 
          style="background-color: #2c3e50;" 
          title="Темно-синій" 
          data-img="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=800&q=80"></button>
          
  <button class="color-btn" 
          style="background-color: #7f8c8d;" 
          title="Сірий" 
          data-img="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&w=800&q=80"></button>
          
  <button class="color-btn" 
          style="background-color: #556b2f;" 
          title="Оливковий" 
          data-img="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80"></button>
</div>
  <footer class="footer">
    <div class="container footer__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
