<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ліжко "Soft Sleep" — MebliHome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Контейнер для сповіщень про додавання в кошик -->
<div id="toast-container" class="toast-container"></div>
  <!-- Шапка -->
  <header class="header">
    <div class="container header__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="#">Про нас</a>
        <a href="#">Контакти</a>
      </nav>
      <div class="header__cart">
        <a href="cart.html" class="cart-btn">Кошик (<span>0</span>)</a>
      </div>
    </div>
  </header>

  <!-- Хлібні крихти -->
  <div class="container page-header">
    <ul class="breadcrumbs">
      <li><a href="index.html">Головна</a></li>
      <li><a href="catalog.html">Ліжка</a></li>
      <li><span>Ліжко "Soft Sleep"</span></li>
    </ul>
  </div>

  <!-- Картка товару -->
  <main class="container product-detail">
    <div class="product-detail__grid">
      
      <!-- Галерея фото ліжка -->
      <div class="product-gallery">
        <div class="product-gallery__main" style="background-image: url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80');"></div>
        <div class="product-gallery__thumbs">
          <div class="thumb active" style="background-image: url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=200&q=80');"></div>
          <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1540518614846-7eded433c457?auto=format&fit=crop&w=200&q=80');"></div>
        </div>
      </div>

      <!-- Інфо -->
      <div class="product-info">
        <span class="category-tag">Артикул: BD-77201</span>
        <h1 class="product-title">Ліжко "Soft Sleep"</h1>
        
        <div class="product-status">
          <span class="status status--in-stock">● В наявності</span>
          <span class="rating">★ 4.8 (12 відгуків)</span>
        </div>

        <div class="product-price-box">
          <span class="price-current">22 300 грн</span>
        </div>

        <!-- Вибір варіантів кольору для ліжка -->
        <div class="product-options">
          <div class="option-group">
            <label>Колір спинки (Екошкіра / Тканина):</label>
            <div class="color-picker">
              <button class="color-btn active" style="background-color: #f5f5dc;" title="Бежевий"></button>
              <button class="color-btn" style="background-color: #333333;" title="Графіт"></button>
              <button class="color-btn" style="background-color: #6e473b;" title="Шоколад"></button>
            </div>
          </div>

          <div class="option-group">
            <label for="size-select">Розмір спального місця:</label>
            <select id="size-select" class="option-select">
              <option value="160x200">160 × 200 см</option>
              <option value="180x200" selected>180 × 200 см</option>
            </select>
          </div>
        </div>

        <!-- Кількість та покупка -->
        <div class="product-actions">
          <div class="quantity-counter">
            <button type="button" class="qty-btn">-</button>
            <input type="number" value="1" min="1" max="99">
            <button type="button" class="qty-btn">+</button>
          </div>
          <button class="btn btn--lg">Додати в кошик</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
