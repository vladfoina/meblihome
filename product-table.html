<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обідній стіл "Oak Wood" — MebliHome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Контейнер для сповіщень про додавання в кошик -->
<div id="toast-container" class="toast-container"></div>
  <!-- Шапка -->
  <header class="header">
    <div class="container header__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="#">Про нас</a>
        <a href="#">Контакти</a>
      </nav>
      <div class="header__cart">
        <a href="cart.html" class="cart-btn">Кошик (<span>0</span>)</a>
      </div>
    </div>
  </header>

  <div class="container page-header">
    <ul class="breadcrumbs">
      <li><a href="index.html">Головна</a></li>
      <li><a href="catalog.html">Столи</a></li>
      <li><span>Стіл "Oak Wood"</span></li>
    </ul>
  </div>

  <main class="container product-detail">
    <div class="product-detail__grid">
      
      <!-- Галерея фото столу -->
      <div class="product-gallery">
        <div class="product-gallery__main" style="background-image: url('https://images.unsplash.com/photo-1615066390971-03e4e1c36ddf?auto=format&fit=crop&w=800&q=80');"></div>
        <div class="product-gallery__thumbs">
          <div class="thumb active" style="background-image: url('https://images.unsplash.com/photo-1615066390971-03e4e1c36ddf?auto=format&fit=crop&w=200&q=80');"></div>
          <div class="thumb" style="background-image: url('https://images.unsplash.com/photo-1530018607912-eff2daa1bac4?auto=format&fit=crop&w=200&q=80');"></div>
        </div>
      </div>

      <div class="product-info">
        <span class="category-tag">Артикул: TB-30211</span>
        <h1 class="product-title">Обідній стіл "Oak Wood"</h1>
        
        <div class="product-status">
          <span class="status status--in-stock">● В наявності</span>
          <span class="rating">★ 5.0 (6 відгуків)</span>
        </div>

        <div class="product-price-box">
          <span class="price-current">12 800 грн</span>
        </div>

        <!-- Варіанти дерева (кольори) -->
        <div class="product-options">
          <div class="option-group">
            <label>Відтінок масиву дерева:</label>
            <div class="color-picker">
              <button class="color-btn active" style="background-color: #8B4513;" title="Натуральний Дуб"></button>
              <button class="color-btn" style="background-color: #3B2219;" title="Темний Горіх"></button>
              <button class="color-btn" style="background-color: #111111;" title="Чорний Морений"></button>
            </div>
          </div>

          <div class="option-group">
            <label for="size-select">Розмір стільниці:</label>
            <select id="size-select" class="option-select">
              <option value="120x80">120 × 80 см</option>
              <option value="140x90" selected>140(180) × 90 см (розкладний)</option>
            </select>
          </div>
        </div>

        <div class="product-actions">
          <div class="quantity-counter">
            <button type="button" class="qty-btn">-</button>
            <input type="number" value="1" min="1" max="99">
            <button type="button" class="qty-btn">+</button>
          </div>
          <button class="btn btn--lg">Додати в кошик</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__wrapper">
      <a href="index.html" class="logo">Mebli<span>Home</span></a>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
